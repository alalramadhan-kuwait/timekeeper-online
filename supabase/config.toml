# Supabase CLI config. Link with:  supabase link --project-ref ttshgrujnycapugrmyxs
project_id = "ttshgrujnycapugrmyxs"

[functions.notify-flush]
verify_jwt = false

[functions.notify-test]
verify_jwt = true

[functions.admin-users]
verify_jwt = true

# The video studio signs the owner in with its own passcode (no auth user, so no staff profile).
[functions.studio]
verify_jwt = false

# Lightspeed functions authorise themselves (cron's x-sync-key, or an
# admin/manager JWT checked in code), so the gateway must not require a JWT.
[functions.lightspeed-sales-sync]
verify_jwt = false

[functions.push-notify]
verify_jwt = true

[functions.notify-dispatch]
verify_jwt = false
