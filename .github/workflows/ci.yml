name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # hard gates — a broken build or type error fails the run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # informational until the vibe-coded lint debt is cleaned up
      - name: Lint
        run: npm run lint
        continue-on-error: true
