<title>مقارنة النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
<style>
/* Layout: parts of 5 sentences. Each card: Ali's real recording (reference, labelled) then anonymous versions
   (letters, order shuffled per sentence), each with 3 scores, error types and tappable words. RTL. */
:root{
  --paper:#f2f4f3; --card:#ffffff; --ink:#18211e; --muted:#5d6b66; --line:#d9e0dd;
  --dial:#1f4d3f; --dial-soft:#e3eeea; --bad:#b4442e; --bad-soft:#f7e4df; --ok:#2f7a4f; --ref:#8a5a12; --ref-soft:#f6ecd9;
  --ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --read:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --card:#1a2220; --ink:#e7eeeb; --muted:#9aa8a3; --line:#2b3633;
  --dial:#7fc3a9; --dial-soft:#1f302b; --bad:#f08a72; --bad-soft:#3a2420; --ok:#7fd1a0; --ref:#e9b86a; --ref-soft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --card:#1a2220; --ink:#e7eeeb; --muted:#9aa8a3; --line:#2b3633;
  --dial:#7fc3a9; --dial-soft:#1f302b; --bad:#f08a72; --bad-soft:#3a2420; --ok:#7fd1a0; --ref:#e9b86a; --ref-soft:#33291a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
main{max-width:760px;margin-inline:auto;display:grid;gap:14px}
header{padding-block:26px 4px;display:grid;gap:6px}
h1{font-family:var(--read);font-weight:600;font-size:1.8rem;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:64ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.part{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.part[aria-pressed="true"]{background:var(--dial);border-color:var(--dial);color:var(--card)}
.save{margin-inline-start:auto}.save.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.sent{font-family:var(--read);font-size:1.1rem;line-height:1.8;margin:0}
.refrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ref-soft);border-radius:8px;padding:8px 10px}
.refrow b{color:var(--ref);font-size:.9rem;white-space:nowrap}
audio{flex:1;min-width:200px;height:36px}
.ver{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.vhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.letter{font-family:var(--read);font-weight:600;font-size:1.2rem;min-width:1.6em;text-align:center;color:var(--dial)}
.scale{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.scale span{min-width:9.5em;color:var(--muted)}
.dot{font:inherit;font-size:.85rem;width:2.1em;height:2.1em;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.dot[aria-pressed="true"]{background:var(--dial);border-color:var(--dial);color:var(--card)}
.types{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.hint{font-size:.78rem;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--read);font-size:1.08rem;line-height:1.7}
.w{font:inherit;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:0 5px;cursor:pointer}
.w:hover{border-color:var(--line)}
.w[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
button:focus-visible{outline:2px solid var(--dial);outline-offset:2px}
.notice{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
</style>
<main dir="rtl" lang="ar">
  <header>
    <h1>نفس الجملة، كذا نسخة</h1>
    <p class="lede">فوق كل جملة تسجيلك الحقيقي، وهو المرجع. تحته صوتين: <b>أ</b> و<b>ب</b>. في هالجلسة كلها «أ» نفس الموديل و«ب» نفس الموديل، بس ما تدري أي واحد. لكل جملة: اختار أي وحدة أقرب لنطقك، واضغط على الكلمات اللي انقالت غلط إذا تبي. وفي الآخر اكتب انطباعك عن «أ» و«ب».</p>
  </header>
  <div class="bar" id="bar"></div>
  <p class="notice" id="notice" hidden>التقييم محفوظ بهالجهاز بس.</p>
  <div id="list" style="display:grid;gap:14px"></div>
</main>
<script>
const ITEMS = __ITEMS__;
const PART = 3;  // one session = one part (Ali: 3 sentences per session)
const SCALES = [];
const TYPES = [];
const state = {};   // "<item>-<letter>" -> {pron, madd, pause, types:[], bad:[]}
let db = null, part = 0;
const $ = s => document.querySelector(s);
function load(){ try{ return JSON.parse(localStorage.getItem("tkvoice-refcmp")||"{}"); }catch(e){ return {}; } }
function keep(){ try{ localStorage.setItem("tkvoice-refcmp", JSON.stringify(state)); }catch(e){} }
const key = (it, o) => it.id + "-" + o.label;
function rated(it){ return !!(state[it.id + "-pick"] || {}).pick; }
function btn(cls, text, pressed, fn){ const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = text; b.setAttribute("aria-pressed", String(pressed)); b.addEventListener("click", () => fn(b)); return b; }
function renderBar(){
  const bar = $("#bar"); bar.textContent = "";
  for (let i = 0; i < Math.ceil(ITEMS.length / PART); i++){
    const sl = ITEMS.slice(i*PART, (i+1)*PART);
    bar.append(btn("part", `الجزء ${i+1} (${sl.filter(rated).length}/${sl.length})`, i === part, () => { part = i; render(); window.scrollTo(0, 0); }));
  }
  const sv = document.createElement("span"); sv.className = "save"; sv.id = "save"; bar.append(sv);
}
// Taps update buttons in place (no re-render), so the audio that is playing keeps playing.
function render(){
  renderBar();
  const list = $("#list"); list.textContent = "";
  for (const it of ITEMS.slice(part*PART, (part+1)*PART)){
    const card = document.createElement("section"); card.className = "card";
    const p = document.createElement("p"); p.className = "sent"; p.textContent = `${it.n}. ${it.text}`; card.append(p);
    const rr = document.createElement("div"); rr.className = "refrow";
    const rb = document.createElement("b"); rb.textContent = "صوتك الحقيقي";
    rr.append(rb, audioEl(it.ref)); card.append(rr);
    for (const o of it.opts){
      const k = key(it, o), st = state[k] ||= {types:[], bad:[]};
      const v = document.createElement("div"); v.className = "ver";
      const vh = document.createElement("div"); vh.className = "vhead";
      const L = document.createElement("span"); L.className = "letter"; L.textContent = o.label;
      vh.append(L, audioEl(o.src)); v.append(vh);
      for (const [sk, sl] of SCALES){
        const row = document.createElement("div"); row.className = "scale";
        const lab = document.createElement("span"); lab.textContent = sl; row.append(lab);
        for (let n = 1; n <= 5; n++) row.append(btn("dot", n, st[sk] === n, b => { st[sk] = n; save(it, o); row.querySelectorAll(".dot").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
        v.append(row);
      }
      const ty = document.createElement("div"); ty.className = "types";
      for (const [tk, tl] of TYPES) ty.append(btn("chip", tl, st.types.includes(tk), b => {
        st.types = st.types.includes(tk) ? st.types.filter(x => x !== tk) : [...st.types, tk]; save(it, o);
        b.setAttribute("aria-pressed", String(st.types.includes(tk))); }));
      v.append(ty);
      const h = document.createElement("div"); h.className = "hint"; h.textContent = "الكلمات اللي انقالت غلط:"; v.append(h);
      const ws = document.createElement("div"); ws.className = "words";
      it.text.split(/\s+/).forEach((w, i) => ws.append(btn("w", w, st.bad.includes(i), b => {
        st.bad = st.bad.includes(i) ? st.bad.filter(x => x !== i) : [...st.bad, i].sort((a, b) => a - b); save(it, o);
        b.setAttribute("aria-pressed", String(st.bad.includes(i))); })));
      v.append(ws); card.append(v);
    }
    const pk = state[it.id + "-pick"] ||= {};
    const q = document.createElement("div"); q.className = "scale";
    const ql = document.createElement("span"); ql.textContent = "أي وحدة أقرب لنطقك؟"; q.append(ql);
    for (const [v, l] of [...it.opts.map(o => [o.label, o.label]), ["same", "نفس الشي"]])
      q.append(btn("chip", l, pk.pick === v, b => { pk.pick = v; savePick(it);
        q.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); renderBar(); }));
    card.append(q);
    list.append(card);
  }
  const nc = document.createElement("section"); nc.className = "card";
  const nl = document.createElement("label"); nl.htmlFor = "note"; nl.className = "hint"; nl.textContent = "انطباعك عن «أ» و«ب» (اللهجة، الوقفات، أي شي):";
  const ta = document.createElement("textarea"); ta.id = "note"; ta.rows = 3; ta.value = (state.note || {}).text || "";
  ta.style.cssText = "font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)";
  ta.addEventListener("change", () => { state.note = {text: ta.value}; keep(); if (db) db.doc("ratings/note").set({ text: ta.value, at: new Date().toISOString() }).catch(() => {}); });
  nc.append(nl, ta); list.append(nc);
}
function savePick(it){
  keep(); if (!db) return;
  const s = $("#save"); if (s){ s.textContent = "يحفظ…"; s.className = "save"; }
  db.doc("ratings/" + it.id + "-pick").set({ item: it.id, pick: state[it.id + "-pick"].pick, at: new Date().toISOString() })
    .then(() => { const s = $("#save"); if (s){ s.textContent = "محفوظ"; s.className = "save ok"; } })
    .catch(() => { const s = $("#save"); if (s) s.textContent = "ما انحفظ"; });
}
function audioEl(src){
  const au = document.createElement("audio"); au.controls = true; au.preload = "none"; au.src = src;
  au.addEventListener("play", () => document.querySelectorAll("audio").forEach(a => { if (a !== au) a.pause(); }));
  return au;
}
const pending = {};
function save(it, o){
  keep(); if (!db) return;
  const k = key(it, o); clearTimeout(pending[k]);
  const s = $("#save"); if (s){ s.textContent = "يحفظ…"; s.className = "save"; }
  pending[k] = setTimeout(async () => {
    const st = state[k], words = it.text.split(/\s+/);
    try{
      await db.doc("ratings/" + k).set({ item: it.id, label: o.label, pron: st.pron || null, madd: st.madd || null, pause: st.pause || null,
        types: st.types, bad: st.bad, badWords: st.bad.map(i => words[i]), at: new Date().toISOString() });
      const s = $("#save"); if (s){ s.textContent = "محفوظ"; s.className = "save ok"; }
    }catch(e){ const s = $("#save"); if (s) s.textContent = "ما انحفظ"; }
  }, 500);
}
Object.assign(state, load()); render();
(async () => {
  db = window.claude?.use ? await window.claude.use("db") : null;
  if (!db){ $("#notice").hidden = false; return; }
  try{ const snap = await db.collection("ratings").get();
    snap.docs.forEach(d => { const v = d.data(); if (!v) return;
      if (d.id === "note") state.note = { text: v.text || "" };
      else if (d.id.endsWith("-pick")) state[d.id] = { pick: v.pick };
      else state[d.id] = { types: v.types || [], bad: v.bad || [] }; });
    keep(); if (![...document.querySelectorAll("audio")].some(a => !a.paused)) render(); }catch(e){}
})();
</script>
