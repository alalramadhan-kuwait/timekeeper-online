<title>مراجعة نطق صوت علي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
<style>
/* Layout: one column of sentences; each word is a tap target; RTL. */
:root{
  --paper:#f2f4f3; --card:#ffffff; --ink:#18211e; --muted:#5d6b66; --line:#d9e0dd;
  --dial:#1f4d3f; --dial-soft:#e3eeea; --bad:#b4442e; --bad-soft:#f7e4df; --ok:#2f7a4f;
  --ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --read:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --card:#1a2220; --ink:#e7eeeb; --muted:#9aa8a3; --line:#2b3633;
  --dial:#7fc3a9; --dial-soft:#1f302b; --bad:#f08a72; --bad-soft:#3a2420; --ok:#7fd1a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --card:#1a2220; --ink:#e7eeeb; --muted:#9aa8a3; --line:#2b3633;
  --dial:#7fc3a9; --dial-soft:#1f302b; --bad:#f08a72; --bad-soft:#3a2420; --ok:#7fd1a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
main{max-width:720px;margin-inline:auto;display:grid;gap:14px}
header{padding-block:26px 4px;display:grid;gap:6px}
h1{font-family:var(--read);font-weight:600;font-size:1.8rem;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.save{margin-inline-start:auto}
.save.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:2ch}
audio{flex:1;min-width:200px;height:36px}
.ok-btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.card.clean .ok-btn{background:var(--dial);border-color:var(--dial);color:var(--card)}
.words{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--read);font-size:1.18rem;line-height:1.7}
.w{font:inherit;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:0 6px;cursor:pointer}
.w:hover{border-color:var(--line)}
.w[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fix{display:grid;gap:6px}
.fix label{font-size:.8rem;color:var(--muted)}
.fix input{font:inherit;font-family:var(--read);font-size:1.02rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
button:focus-visible,input:focus-visible{outline:2px solid var(--dial);outline-offset:2px}
.notice{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
</style>
<main dir="rtl" lang="ar">
  <header>
    <h1>مراجعة النطق</h1>
    <p class="lede">النسخة الفائزة بس. اسمع الجملة، واضغط على أي كلمة انقالت غلط فتصير حمرا. وإذا تبي، اكتب شلون المفروض تنقال. وإذا الجملة سليمة، اضغط «سليمة».</p>
  </header>
  <div class="bar"><span>راجعت <b id="done">0</b> من <b id="total">0</b></span><span>كلمات غلط: <b id="bad">0</b></span><span class="save" id="save"></span></div>
  <p class="notice" id="notice" hidden>المراجعة محفوظة بهالجهاز بس، لأن الحفظ المشترك مو متاح بهالعرض.</p>
  <div id="list" style="display:grid;gap:14px"></div>
</main>
<script>
const ITEMS = __ITEMS__;
const state = {};   // id -> {bad:[word index], note:"", clean:bool}
let db = null;
const $ = s => document.querySelector(s);
function load(){ try{ return JSON.parse(localStorage.getItem("tkvoice-review")||"{}"); }catch(e){ return {}; } }
function keep(){ try{ localStorage.setItem("tkvoice-review", JSON.stringify(state)); }catch(e){} }

function render(){
  const list = $("#list"); list.textContent = "";
  let done = 0, bad = 0;
  for (const it of ITEMS){
    const st = state[it.id] ||= {bad:[], note:"", clean:false};
    if (st.clean || st.bad.length) done++;
    bad += st.bad.length;
    const card = document.createElement("section"); card.className = "card" + (st.clean ? " clean" : "");
    const top = document.createElement("div"); top.className = "top";
    const num = document.createElement("span"); num.className = "num"; num.textContent = it.n;
    const au = document.createElement("audio"); au.controls = true; au.preload = "none"; au.src = it.src;
    au.addEventListener("play", () => document.querySelectorAll("audio").forEach(a => { if (a !== au) a.pause(); }));
    const ok = document.createElement("button"); ok.type = "button"; ok.className = "ok-btn";
    ok.textContent = st.clean ? "سليمة ✓" : "سليمة";
    ok.addEventListener("click", () => { st.clean = !st.clean; if (st.clean) st.bad = []; save(it); render(); });
    top.append(num, au, ok); card.append(top);
    const words = document.createElement("div"); words.className = "words";
    it.text.split(/\s+/).forEach((w, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "w"; b.textContent = w;
      b.setAttribute("aria-pressed", String(st.bad.includes(i)));
      b.addEventListener("click", () => {
        st.bad = st.bad.includes(i) ? st.bad.filter(x => x !== i) : [...st.bad, i].sort((a,b) => a-b);
        if (st.bad.length) st.clean = false;
        save(it); render();
      });
      words.append(b);
    });
    card.append(words);
    if (st.bad.length){
      const fix = document.createElement("div"); fix.className = "fix";
      const lab = document.createElement("label"); lab.htmlFor = "fix-" + it.id; lab.textContent = "شلون المفروض تنقال؟ (اختياري)";
      const inp = document.createElement("input"); inp.id = "fix-" + it.id; inp.value = st.note;
      inp.placeholder = "مثلاً: غولاي تنقال «قولاي»";
      inp.addEventListener("change", () => { st.note = inp.value; save(it); });
      fix.append(lab, inp); card.append(fix);
    }
    list.append(card);
  }
  $("#done").textContent = done; $("#total").textContent = ITEMS.length; $("#bad").textContent = bad;
}

const pending = {};
function save(it){
  keep();
  if (!db) return;
  clearTimeout(pending[it.id]);
  $("#save").textContent = "يحفظ…"; $("#save").className = "save";
  pending[it.id] = setTimeout(async () => {
    const st = state[it.id], words = it.text.split(/\s+/);
    try{
      await db.doc("review/" + it.id).set({ clean: st.clean, bad: st.bad, badWords: st.bad.map(i => words[i]), note: st.note, at: new Date().toISOString() });
      $("#save").textContent = "محفوظ"; $("#save").className = "save ok";
    }catch(e){ $("#save").textContent = "ما انحفظ"; }
  }, 500);
}

Object.assign(state, load());
render();
(async () => {
  db = window.claude?.use ? await window.claude.use("db") : null;
  if (!db){ $("#notice").hidden = false; return; }
  try{
    const snap = await db.collection("review").get();
    snap.docs.forEach(d => { const v = d.data(); if (v) state[d.id] = { bad: v.bad || [], note: v.note || "", clean: !!v.clean }; });
    keep(); render();
  }catch(e){}
})();
</script>
