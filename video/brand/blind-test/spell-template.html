<title>تهجئة النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
<style>
/* Layout: one card per word, its spellings as playable choices; RTL. */
:root{
  --paper:#f2f4f3; --card:#ffffff; --ink:#18211e; --muted:#5d6b66; --line:#d9e0dd;
  --dial:#1f4d3f; --dial-soft:#e3eeea; --ok:#2f7a4f;
  --ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --read:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --card:#1a2220; --ink:#e7eeeb; --muted:#9aa8a3; --line:#2b3633;
  --dial:#7fc3a9; --dial-soft:#1f302b; --ok:#7fd1a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --card:#1a2220; --ink:#e7eeeb; --muted:#9aa8a3; --line:#2b3633;
  --dial:#7fc3a9; --dial-soft:#1f302b; --ok:#7fd1a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
main{max-width:720px;margin-inline:auto;display:grid;gap:14px}
header{padding-block:26px 4px;display:grid;gap:6px}
h1{font-family:var(--read);font-weight:600;font-size:1.8rem;line-height:1.3;margin:0}
.lede{color:var(--muted);margin:0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px;display:flex;gap:12px;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.save{margin-inline-start:auto}.save.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.word{font-family:var(--read);font-weight:600;font-size:1.5rem;margin:0}
.sent{font-family:var(--read);color:var(--muted);margin:0;font-size:1.02rem}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.opt.on{border-color:var(--dial);background:var(--dial-soft)}
.sp{font-family:var(--read);font-size:1.15rem;min-width:5.5rem}
audio{flex:1;min-width:190px;height:36px}
.pick,.none{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.opt.on .pick,.none[aria-pressed="true"]{background:var(--dial);border-color:var(--dial);color:var(--card)}
button:focus-visible{outline:2px solid var(--dial);outline-offset:2px}
.notice{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
</style>
<main dir="rtl" lang="ar">
  <header>
    <h1>أي تهجئة تطلع صح؟</h1>
    <p class="lede">كل كلمة من اللي علّمت عليها انكتبت بكذا شكل، والصوت نفس النسخة الفائزة. اسمعها، واختار اللي تنقال مثل ما تقولها أنت. وإذا ولا وحدة صح، اختار «ولا وحدة».</p>
  </header>
  <div class="bar"><span>اخترت <b id="done">0</b> من <b id="total">0</b></span><span class="save" id="save"></span></div>
  <p class="notice" id="notice" hidden>الاختيارات محفوظة بهالجهاز بس.</p>
  <div id="list" style="display:grid;gap:14px"></div>
</main>
<script>
const WORDS = __WORDS__;
const state = {};
let db = null;
const $ = s => document.querySelector(s);
function load(){ try{ return JSON.parse(localStorage.getItem("tkvoice-spell")||"{}"); }catch(e){ return {}; } }
function keep(){ try{ localStorage.setItem("tkvoice-spell", JSON.stringify(state)); }catch(e){} }
function render(){
  const list = $("#list"); list.textContent = "";
  for (const w of WORDS){
    const pick = state[w.n];
    const card = document.createElement("section"); card.className = "card";
    const h = document.createElement("p"); h.className = "word"; h.textContent = w.word;
    const s = document.createElement("p"); s.className = "sent"; s.textContent = w.sentence;
    card.append(h, s);
    for (const o of w.opts){
      const row = document.createElement("div"); row.className = "opt" + (pick === o.spelling ? " on" : "");
      const sp = document.createElement("span"); sp.className = "sp"; sp.textContent = o.spelling;
      const au = document.createElement("audio"); au.controls = true; au.preload = "none"; au.src = o.src;
      au.addEventListener("play", () => document.querySelectorAll("audio").forEach(a => { if (a !== au) a.pause(); }));
      const b = document.createElement("button"); b.type = "button"; b.className = "pick";
      b.textContent = pick === o.spelling ? "هذي ✓" : "هذي";
      b.addEventListener("click", () => { state[w.n] = o.spelling; save(w); render(); });
      row.append(sp, au, b); card.append(row);
    }
    const none = document.createElement("button"); none.type = "button"; none.className = "none";
    none.textContent = "ولا وحدة"; none.setAttribute("aria-pressed", String(pick === "none"));
    none.addEventListener("click", () => { state[w.n] = "none"; save(w); render(); });
    card.append(none); list.append(card);
  }
  $("#done").textContent = WORDS.filter(w => state[w.n]).length; $("#total").textContent = WORDS.length;
}
function save(w){
  keep(); if (!db) return;
  $("#save").textContent = "يحفظ…"; $("#save").className = "save";
  db.doc("spell/w" + w.n).set({ word: w.word, choice: state[w.n], at: new Date().toISOString() })
    .then(() => { $("#save").textContent = "محفوظ"; $("#save").className = "save ok"; })
    .catch(() => { $("#save").textContent = "ما انحفظ"; });
}
Object.assign(state, load()); render();
(async () => {
  db = window.claude?.use ? await window.claude.use("db") : null;
  if (!db){ $("#notice").hidden = false; return; }
  try{ const snap = await db.collection("spell").get();
    snap.docs.forEach(d => { const v = d.data(); if (v) state[Number(d.id.slice(1))] = v.choice; }); keep(); render(); }catch(e){}
})();
</script>
