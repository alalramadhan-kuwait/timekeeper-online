<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable turn off the browser's own zoom. A pinch or
         a double tap in a dashboard only ever left the interface at some
         arbitrary scale you then had to undo, and it made the sticky header
         drift away from the top. Safari ignores both of these on its own, so
         the gesture events are refused in script as well. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Timekeeper Online — Operations Control</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The app's own chrome is dark and already pads for the inset, so the
         status bar sits over it with white text where it belongs. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Timekeeper" />
    <meta name="application-name" content="Timekeeper" />
    <!-- Launch screens. Without these iOS shows a blank white rectangle for as
         long as the app takes to boot, which on a dashboard that has to reach
         the database first is long enough to look broken. -->
