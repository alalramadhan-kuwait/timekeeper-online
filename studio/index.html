<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Design Studio has moved</title>
<!-- The studio now lives in its own repository and its own Pages site. This
     stub stays behind only so links already shared do not land on a 404.
     Three ways out, because any one of them can be unavailable: the canonical
     tells crawlers, the refresh covers scripting being off, the script is the
     fast path, and the link covers a browser that honours none of them. -->
<link rel="canonical" href="https://alalramadhan-kuwait.github.io/watch-design-studio/">
<meta http-equiv="refresh" content="0; url=https://alalramadhan-kuwait.github.io/watch-design-studio/">
<meta name="robots" content="noindex, follow">
<style>
  :root{ color-scheme: light dark; }
  body{ margin:0; min-height:100dvh; display:grid; place-items:center;
        padding:24px; background:#111418; color:#E8EBEE;
        font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card{ max-width:32rem; text-align:center }
  h1{ font-size:1.25rem; font-weight:600; margin:0 0 .5rem }
  p{ margin:0 0 1.25rem; color:#98A2AE }
  a{ display:inline-block; padding:.7rem 1.2rem; border-radius:999px;
     background:#D4AF37; color:#15181C; font-weight:600; text-decoration:none }
  a:hover{ background:#E0BC45 }
</style>
</head>
<body>
  <div class="card">
    <h1>The Watch Design Studio has moved</h1>
    <p>It now has its own home. You should be sent there automatically.</p>
    <a href="https://alalramadhan-kuwait.github.io/watch-design-studio/">Open the studio</a>
  </div>
  <script>location.replace("https://alalramadhan-kuwait.github.io/watch-design-studio/");</script>
</body>
</html>
